name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show only the errors
        if: failure()
        run: |
          echo "=============== ERRORS ==============="
          grep -E "^e: |error:|What went wrong" -A4 build.log | head -60

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ButterflyPet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ButterflyPet-APK
          path: ButterflyPet.apk

      - name: Publish release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: الفراشة الحية - build ${{ github.run_number }}
          files: ButterflyPet.apk
